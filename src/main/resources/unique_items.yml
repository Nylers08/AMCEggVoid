    enchantments:
      sharpness: 5
      efficiency: 5
      knockback: 2
    unbreakable: true

  sus_cookie:
    name: "§6Подозрительное Печенье"
    material: "COOKIE"
    lore:
      - "§7Кто его сюда положил?!"
    enchantments:
      luck_of_the_sea: 3

  sigma_brick:
    name: "§cКирпич Сигмы"
    material: "BRICK"
    lore:
      - "§7Один удар — и враг задумается о жизни"
    enchantments:
      sharpness: 3
      knockback: 3

  goblin_compass:
    name: "§aКомпас Жадного Гоблина"
