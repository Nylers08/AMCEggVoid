members:
  - "Nylers0"
  - "Vilwi"

non-drop-items:
  - "BLAZE_ROD"
  - "BLAZE_POWDER"
  - "OBSIDIAN"
  - "ENDER_PEARL"
  - "ENDER_EYE"
  - "DRAGON_EGG"

boss-bar:
  sound: "minecraft:block.note_block.bit"
  volume: 0.5
  pitch: 0.5
  sec-to-sound: 3

  delay-tick-update: 20

  text-time-info: "§x§F§C§D§0§5§CВр§x§F§C§C§3§5§Eем§x§F§C§B§5§6§1я §x§F§C§A§8§6§3до§x§F§C§9§A§6§5 н§x§F§C§8§D§6§7ов§x§F§B§7§F§6§Aых§x§F§B§7§2§6§C п§x§F§B§6§4§6§Eре§x§F§B§5§7§7§0дм§x§F§B§4§9§7§3ет§x§F§B§3§C§7§5ов: §6%sс"
  text-give-item: "§x§F§C§D§0§5§CПр§x§F§C§C§8§5§Cед§x§F§C§B§F§5§Cме§x§F§C§B§7§5§Cты§x§F§C§A§F§5§C в§x§F§C§A§7§5§Cыд§x§F§C§9§E§5§Cан§x§F§C§9§6§5§Cы!"

item-giver:
  sound: "minecraft:block.note_block.bell"
  volume: 1
  pitch: 1

nether:
  grid-y: 64
  netherrack-step: 3
  blaze-zone:
    brick-step: 2
    max-blocks-on-edge: 15
    min-blocks-on-edge: 9
    max-zones: 3
    padding: 10
  piglin-zone:
    block-step: 2
    max-blocks-on-edge: 15
    min-blocks-on-edge: 9
    max-zones: 3
    padding: 10
  chests:
    enabled: true
    min-chests: 8 # Мин. кол-во сундуков при генерации Незера
    max-chests: 15 # Макс. кол-во сундуков при генерации Незера

# Настройка жителя-торговца (/eggvoid trader)
trader:
  name: "§6§lТорговец Бездны"
  profession: "CLERIC" # Профессия жителя (CLERIC, FARMER, LIBRARIAN, ARMORER и т.д.)
  invulnerable: true
  # Список торгов: поддерживаются уникальные предметы из unique_items.yml и стандартные материалы Minecraft.
  # Формат: "ID:кол-во" или объект { item: "ID", amount: N }
  trades:
    - buy: "mega_diamond:2"
      sell: "void_sword:1"
      max-uses: 999
    - buy: "EMERALD:16"
      sell: "mega_diamond:1"
      max-uses: 999
    - buy: "NETHERITE_SCRAP:4"
      buy2: "mega_emerald:2"
      sell: "GOLDEN_APPLE:3"
      max-uses: 999

# Настройки Энда (/eggvoid endgen)
end:
  grid-y: 64
  scatter-chance: 0.045
  generate-pillars: true
  spawn-dragon: true

# Настройки Алтаря Портала в Энд (/eggvoid portal)
end-portal:
  hologram:
    line-spacing: 0.28
    base-y-offset: 1.3
    requirement-line: "§f{name}: §e{collected}§7/§e{required} §7(осталось §c{left}§7)"
    requirement-done-line: "§a✔ {name}: §a{collected}/{required}"
    progress-lines:
      - "§5§lАЛТАРЬ ЭНДА §7(§d{eyes}§7/§d12 §7очей • §e{percent}%§7)"
      - "{requirements}"
      - "§eБросайте нужные ресурсы внутрь портала!"
    opened-lines:
      - "§5§lАЛТАРЬ ЭНДА §a§lОТКРЫТ!"
      - "§7Прогресс: §a12§7/§a12 §7очей (§a100%§7)"
      - "§dПрыгайте в портал!"
  item-names:
    BLAZE_ROD: "Стержень ифрита"
    BLAZE_POWDER: "Огненный порошок"
    ENDER_PEARL: "Жемчуг Эндера"
    OBSIDIAN: "Обсидиан"
    GOLD_INGOT: "Золотой слиток"
  requirements:
    BLAZE_ROD: 40
    BLAZE_POWDER: 40
    ENDER_PEARL: 40
    OBSIDIAN: 80
    GOLD_INGOT: 64

# Настройки дополнительных мини-ивентов (/eggvoid event ...)
mini-events:
  auto-enabled: true
  only-when-main-event-running: true
  min-interval-seconds: 600
  max-interval-seconds: 1200
  countdown-seconds: 60
  # Показывать ли название следующего ивента во время обратного отсчёта (false = тайна)
  reveal-next-event: true
  secret-event-name: "§5§lСекретный ивент"
  countdown-bossbar-text: "§eДоп. ивент %event% §eначнётся через §c%time%с"
  active-bossbar-text: "§aИдёт доп. ивент: %event% §7(осталось §e%time%с§7)"
  events:
    pvp:
      reveal-in-countdown: true
      duration-seconds: 120
    mob_wave:
      reveal-in-countdown: true
      duration-seconds: 90
      spawn-interval-seconds: 12
      mobs-per-player-per-wave: 3
      min-radius: 8
      max-radius: 24
    boss:
      reveal-in-countdown: false
      duration-seconds: 180
    loot_chest:
      reveal-in-countdown: true
      duration-seconds: 0
      min-y: 56
      max-y: 78
      search-radius: 16
      origin-spread: 20
      min-items: 5
      max-items: 9
      totem-chance: 0.35
    trader:
      reveal-in-countdown: true
      duration-seconds: 180
      min-y: 54
      max-y: 78
      search-attempts: 30
    void_drop:
      reveal-in-countdown: true
      duration-seconds: 90
      rewards:
        top-1:
          - "void_sword:1"
          - "TOTEM_OF_UNDYING:1"
          - "ENCHANTED_GOLDEN_APPLE:2"
          - "NETHERITE_INGOT:3"
          - "mega_diamond:4"
          - "ENDER_PEARL:16"
        top-2:
          - "void_pickaxe:1"
          - "TOTEM_OF_UNDYING:1"
          - "GOLDEN_APPLE:8"
          - "NETHERITE_INGOT:1"
          - "mega_diamond:2"
          - "BLAZE_ROD:8"
        top-3:
          - "sky_axe:1"
          - "GOLDEN_APPLE:6"
          - "DIAMOND:16"
          - "mega_emerald:2"
          - "OBSIDIAN:16"
    anvil_rain:
      reveal-in-countdown: true
      duration-seconds: 60
      spawn-interval-ticks: 15
      anvils-per-player: 2
      xz-spread: 10
      y-offset: 92
      damage-per-block: 2.0
      max-damage: 40
    hangover:
      reveal-in-countdown: true
      duration-seconds: 45
      nausea-amplifier: 0
      blindness-amplifier: 0
      refresh-interval-ticks: 40
    jump_boost:
      reveal-in-countdown: true
      duration-seconds: 45
      amplifier: 2
      refresh-interval-ticks: 40
    meatball_rain:
      reveal-in-countdown: true
      duration-seconds: 45
      spawn-interval-ticks: 10
      meatballs-per-player: 2
      xz-spread: 12
      y-offset: 28

# Настройки PvP между участниками (/eggvoid pvp <on|off>)
pvp:
  enabled: false
  deny-message: "§6AMCEggVoid | §cPvP между участниками сейчас отключено!"
  message-cooldown-ms: 1500

# Настройка потери вещей при смерти игрока (в процентах от 0 до 100)
# Ключевые предметы (non-drop-items) и хотбар (слоты 0-8) никогда не выпадают.
player-drop:
  combat-tag-seconds: 15
  self-death:
    min-percent: 0.0
    max-percent: 50.0
  mob-death:
    min-percent: 0.0
    max-percent: 30.0
  player-death:
    min-percent: 0.0
    max-percent: 10.0
