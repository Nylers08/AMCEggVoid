# Настройка выдачи предметов по уровням времени
item-tier:
  levels:
    1:
      tick-start: 0
      give-tick-delay: 100

      items:
        - "mega_diamond:1:12"
        - "STICK:1:12"

    2:
      tick-start: 400
      give-tick-delay: 200

      items:
        - "void_sword:1:1"
        - "mega_emerald:1:12"
        - "OAK_SLAB:1:12"

# Настройка дополнительного нестандартного дропа с ифритов (Blaze)
blaze-drop:
  enabled: true
  chance: 0.35 # Шанс выпадения дополнительного дропа при смерти ифрита (0.35 = 35%)
  player-kill-only: false # Выпадать только при убийстве игроком (false = при любой смерти ифрита)
  roll-mode: "RANDOM_ONE" # "RANDOM_ONE" (выбирается один предмет из списка) или "ALL" (проверяется шанс каждого предмета)

  # Список предметов: поддерживаются уникальные предметы из unique_items.yml и стандартные материалы Minecraft.
  # Формат строки: "ID:min:max" или "ID:min:max:шанс"
  items:
    - "mega_diamond:1:2"
    - "void_sword:1:1"
    - "mega_emerald:1:3"
    - "NETHERITE_SCRAP:1:2"

# Настройка лута в сундуках по мирам (nether, в будущем end и др.)
chest:
  nether:
    min-items: 2 # Мин. кол-во слотов с лутом в одном сундуке
    max-items: 5 # Макс. кол-во слотов с лутом в одном сундуке
    # Список лута: уникальные предметы из unique_items.yml и материалы Minecraft
    # Формат: "ID:min:max" или "ID:min:max:шанс"
    loot:
      - "mega_diamond:1:2"
      - "void_sword:1:1:0.2"
      - "mega_emerald:1:3"
      - "GOLDEN_APPLE:1:4"
      - "NETHERITE_SCRAP:1:2"
      - "OBSIDIAN:2:6"
