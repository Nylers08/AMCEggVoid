boss-bar:
  sound: "minecraft:block.note_block.bit"
  volume: 0.5
  pitch: 0.5
  sec-to-sound: 3

  delay-tick-update: 20

  text-time-info: "§x§F§C§D§0§5§CВр§x§F§C§C§3§5§Eем§x§F§C§B§5§6§1я §x§F§C§A§8§6§3до§x§F§C§9§A§6§5 н§x§F§C§8§D§6§7ов§x§F§B§7§F§6§Aых§x§F§B§7§2§6§C п§x§F§B§6§4§6§Eре§x§F§B§5§7§7§0дм§x§F§B§4§9§7§3ет§x§F§B§3§C§7§5ов: §6%sс"
  text-give-item: "§x§F§C§D§0§5§CПр§x§F§C§C§8§5§Cед§x§F§C§B§F§5§Cме§x§F§C§B§7§5§Cты§x§F§C§A§F§5§C в§x§F§C§A§7§5§Cыд§x§F§C§9§E§5§Cан§x§F§C§9§6§5§Cы!"

item-giver:
  sound: "minecraft:block.note_block.bell"
  volume: 1
  pitch: 1

nether:
  grid-y: 64
  netherrack-step: 3
  blaze-zone:
    brick-step: 2
    max-blocks-on-edge: 15
    min-blocks-on-edge: 9
    max-zones: 3
    padding: 10
  piglin-zone:
    block-step: 2
    max-blocks-on-edge: 15
    min-blocks-on-edge: 9
    max-zones: 3
    padding: 10
  chests:
    enabled: true
    min-chests: 8 # Мин. кол-во сундуков при генерации Незера
    max-chests: 15 # Макс. кол-во сундуков при генерации Незера

# Настройка жителя-торговца (/eggvoid trader)
trader:
  name: "§6§lТорговец Бездны"
  profession: "CLERIC" # Профессия жителя (CLERIC, FARMER, LIBRARIAN, ARMORER и т.д.)
  invulnerable: true
  # Список торгов: поддерживаются уникальные предметы из unique_items.yml и стандартные материалы Minecraft.
  # Формат: "ID:кол-во" или объект { item: "ID", amount: N }
  trades:
    - buy: "mega_diamond:2"
      sell: "void_sword:1"
      max-uses: 999
    - buy: "EMERALD:16"
      sell: "mega_diamond:1"
      max-uses: 999
    - buy: "NETHERITE_SCRAP:4"
      buy2: "mega_emerald:2"
      sell: "GOLDEN_APPLE:3"
      max-uses: 999

# Настройки Энда (/eggvoid endgen)
end:
  grid-y: 64
  scatter-chance: 0.045
  generate-pillars: true
  spawn-dragon: true

# Настройка потери вещей при смерти игрока (в процентах от 0 до 100)
# Ключевые предметы (non-drop-items) и хотбар (слоты 0-8) никогда не выпадают.
player-drop:
  combat-tag-seconds: 15
  self-death:
    min-percent: 0.0
    max-percent: 50.0
  mob-death:
    min-percent: 0.0
    max-percent: 30.0
  player-death:
    min-percent: 0.0
    max-percent: 10.0
