items:
  mega_diamond:
    name: "§6Мега алмаз"
    material: "DIAMOND"
    lore:
      - "§7Его ебали"
      - "§75 узбеков"
    enchantments:
      unbreaking: 3

  void_sword:
    name: "§cКлинок Бездны"
    material: "NETHERITE_SWORD"
    lore:
      - "§7Закалён в пустоте EggVoid"
    enchantments:
      sharpness: 5
      fire_aspect: 2
      unbreaking: 3
    unbreakable: true

  mega_emerald:
    name: "§aМега изюм"
    material: "EMERALD"
    lore:
      - "§75 узбеков"

  # Зачарованная броня
  starter_helmet:
    name: "§eКаска Строителя"
    material: "GOLDEN_HELMET"
    lore:
      - "§7Защитит голову от падающего булыжника"
    enchantments:
      protection: 2
      unbreaking: 5
      aqua_affinity: 1

  bounce_boots:
    name: "§bТапки Прыгуна"
    material: "DIAMOND_BOOTS"
    lore:
      - "§7Мягкая посадка с любой высоты"
    enchantments:
      feather_falling: 4
      depth_strider: 3
      unbreaking: 3

  void_helmet:
    name: "§5Шлем Пустоты"
    material: "NETHERITE_HELMET"
    lore:
      - "§7Часть легендарного сета Бездны"
    enchantments:
      protection: 4
      respiration: 3
      unbreaking: 3
    unbreakable: true

  void_chestplate:
    name: "§5Нагрудник Пустоты"
    material: "NETHERITE_CHESTPLATE"
    lore:
      - "§7Часть легендарного сета Бездны"
    enchantments:
      protection: 4
      thorns: 2
      unbreaking: 3
    unbreakable: true

  void_leggings:
    name: "§5Поножи Пустоты"
    material: "NETHERITE_LEGGINGS"
    lore:
      - "§7Часть легендарного сета Бездны"
    enchantments:
      protection: 4
      swift_sneak: 3
      unbreaking: 3
    unbreakable: true

  void_boots:
    name: "§5Сапоги Пустоты"
    material: "NETHERITE_BOOTS"
    lore:
      - "§7Часть легендарного сета Бездны"
    enchantments:
      protection: 4
      feather_falling: 4
      unbreaking: 3
    unbreakable: true

  # Уникальное оружие и инструменты
  sky_axe:
    name: "§bТопор Небесного Гнева"
    material: "DIAMOND_AXE"
    lore:
      - "§7Рубит и деревья, и щиты противников"
    enchantments:
      sharpness: 4
      efficiency: 5
      unbreaking: 3

  void_bow:
    name: "§dЛук Бездны"
    material: "BOW"
    lore:
      - "§7Стреляет горящими стрелами в пустоту"
    enchantments:
      power: 5
      punch: 2
      flame: 1
      infinity: 1
      unbreaking: 3

  sniper_crossbow:
    name: "§cАрбалет Снайпера"
    material: "CROSSBOW"
    lore:
      - "§7Перезаряжается быстрее, чем ты моргнёшь"
    enchantments:
      quick_charge: 3
      piercing: 4
      unbreaking: 3

  void_pickaxe:
    name: "§3Кирка Шахтёра Пустоты"
    material: "NETHERITE_PICKAXE"
    lore:
