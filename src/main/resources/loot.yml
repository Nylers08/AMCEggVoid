# Настройка дополнительного нестандартного дропа с ифритов (Blaze)
blaze-drop:
  enabled: true
  chance: 0.25 # Общий фолбэк-шанс, если у предмета не указан свой шанс
  player-kill-only: false # Выпадать только при убийстве игроком (false = при любой смерти ифрита)
  roll-mode: "ALL" # Проверяется индивидуальный шанс каждого предмета

  # Список предметов: поддерживаются уникальные предметы из unique_items.yml и стандартные материалы Minecraft.
  # Формат строки: "ID:min:max:шанс"
  items:
    # Зачарованная броня (малый шанс)
    - "starter_helmet:1:1:0.05"
    - "bounce_boots:1:1:0.04"
    - "void_helmet:1:1:0.02"
    - "void_chestplate:1:1:0.02"
    - "void_leggings:1:1:0.02"
    - "void_boots:1:1:0.02"
    # Мемные вещи (малый шанс)
    - "uzbek_bread:1:1:0.06"
    - "lucky_fish:1:1:0.05"
    - "admin_slipper:1:1:0.03"
    - "cursed_potato:1:2:0.06"
    - "sigma_brick:1:1:0.04"
    - "grandma_pan:1:1:0.04"
    - "sleepy_pillow:1:1:0.03"
    - "sus_cookie:1:2:0.06"
    - "knockback_stick:1:1:0.03"
    # Полезные ресурсы
    - "OBSIDIAN:1:3:0.15"
    - "ENDER_PEARL:1:2:0.15"
    - "END_PORTAL_FRAME:1:1:0.01"
    - "NETHERITE_SCRAP:1:2:0.08"
    - "DIAMOND:1:3:0.12"
    - "GOLD_INGOT:2:5:0.18"
    - "GOLDEN_APPLE:1:2:0.08"
    - "EXPERIENCE_BOTTLE:2:5:0.15"
    - "FIRE_CHARGE:1:3:0.18"
    - "mega_diamond:1:2:0.06"
    - "mega_emerald:1:2:0.08"
    - "void_sword:1:1:0.02"

# Настройка лута в сундуках по мирам (nether, в будущем end и др.)
chest:
  nether:
    min-items: 2 # Мин. кол-во слотов с лутом в одном сундуке
    max-items: 5 # Макс. кол-во слотов с лутом в одном сундуке
    # Список лута: уникальные предметы из unique_items.yml и материалы Minecraft
    # Формат: "ID:min:max" или "ID:min:max:шанс"
    loot:
      - "mega_diamond:1:2"
      - "void_sword:1:1:0.2"
      - "mega_emerald:1:3"
      - "GOLDEN_APPLE:1:4"
      - "NETHERITE_SCRAP:1:2"
      - "OBSIDIAN:2:6"

# Настройка уникального лута при торгах с пиглинами (Piglin Bartering)
piglin-barter:
  enabled: true
  replace-vanilla: true # true = при выпадении уникального лута заменяет ванильный (иначе добавляется к нему)
