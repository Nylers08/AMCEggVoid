      sharpness: 3
      fire_aspect: 2
      knockback: 3

  sleepy_pillow:
    name: "§fПодушка-Вырубушка"
    material: "WHITE_WOOL"
    lore:
      - "§7Мягкая снаружи, уносит в бездну внутри"
    enchantments:
      knockback: 5

  golden_carrot_king:
    name: "§6Королевская Морковка"
    material: "GOLDEN_CARROT"
    lore:
      - "§7Для идеального зрения в темноте Энда"
    enchantments:
      sharpness: 4
      unbreaking: 5
